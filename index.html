  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <!--
      Blocking script: sets data-theme BEFORE React hydrates to prevent
      a flash of the wrong theme (FOUC). Mirrors the logic in useTheme.ts.
    -->
    <script>
      (function () {
        var mode = localStorage.getItem("themeMode") || "auto";
        var hour = new Date().getHours();
        var theme =
          mode === "auto" ? (hour >= 6 && hour < 18 ? "light" : "dark") : mode;
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
